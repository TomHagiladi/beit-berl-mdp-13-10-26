<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח פרבולה - גיבוי להדגמה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--g:#75B743;--gd:#5E9A28;--r:#AF242A;--ink:#4A4845;--line:#E2E7DB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',Arial,sans-serif;background:#fff;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
h1{font-size:34px;font-weight:800;color:var(--gd);margin-bottom:6px}
.sub{font-size:18px;color:#7A7874;margin-bottom:18px}
.wrap{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%;max-width:1200px}
canvas{border:2px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
.ctl{min-width:300px;flex:0 1 340px}
.row{margin:0 0 22px}
.row label{display:flex;justify-content:space-between;font-size:24px;font-weight:500;margin-bottom:6px}
.row b{color:var(--r);font-weight:800}
input[type=range]{width:100%;accent-color:var(--g);height:28px}
.eq{direction:ltr;text-align:center;font-size:30px;font-weight:800;background:#F5FAF0;border:2px solid var(--g);border-radius:10px;padding:12px;margin-bottom:22px}
.hint{font-size:18px;line-height:1.5;background:#F2F5EE;border-right:5px solid var(--r);padding:12px 14px;border-radius:6px}
</style>
</head>
<body>
<h1>לוח פרבולה</h1>
<p class="sub">מזיזים סליידר, והגרף זז מיד. גיבוי להדגמה החיה.</p>
<div class="wrap">
  <canvas id="c" width="720" height="560" aria-label="גרף הפרבולה"></canvas>
  <div class="ctl">
    <div class="eq" id="eq"></div>
    <div class="row"><label for="a">פרמטר a <b id="va"></b></label><input id="a" type="range" min="-3" max="3" step="0.1" value="1"></div>
    <div class="row"><label for="b">פרמטר b <b id="vb"></b></label><input id="b" type="range" min="-6" max="6" step="0.5" value="0"></div>
    <div class="row"><label for="cc">פרמטר c <b id="vc"></b></label><input id="cc" type="range" min="-6" max="6" step="0.5" value="0"></div>
    <p class="hint" id="hint"></p>
  </div>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const A=document.getElementById('a'),B=document.getElementById('b'),C=document.getElementById('cc');
const S=40,OX=cv.width/2,OY=cv.height/2;
function fmt(n){return (Math.round(n*10)/10).toString();}
function draw(){
  const a=+A.value,b=+B.value,c=+C.value;
  x.clearRect(0,0,cv.width,cv.height);
  x.strokeStyle='#EEF1EA';x.lineWidth=1;
  for(let i=OX%S;i<cv.width;i+=S){x.beginPath();x.moveTo(i,0);x.lineTo(i,cv.height);x.stroke();}
  for(let j=OY%S;j<cv.height;j+=S){x.beginPath();x.moveTo(0,j);x.lineTo(cv.width,j);x.stroke();}
  x.strokeStyle='#9A9893';x.lineWidth=2;
  x.beginPath();x.moveTo(0,OY);x.lineTo(cv.width,OY);x.moveTo(OX,0);x.lineTo(OX,cv.height);x.stroke();
  x.strokeStyle='#75B743';x.lineWidth=4;x.beginPath();
  let first=true;
  for(let px=0;px<=cv.width;px+=2){const X=(px-OX)/S,Y=a*X*X+b*X+c,py=OY-Y*S;
    if(py<-2000||py>3000){first=true;continue;} if(first){x.moveTo(px,py);first=false;} else x.lineTo(px,py);}
  x.stroke();
  if(a!==0){const vx=-b/(2*a),vy=a*vx*vx+b*vx+c;x.fillStyle='#AF242A';x.beginPath();x.arc(OX+vx*S,OY-vy*S,7,0,7);x.fill();}
  document.getElementById('va').textContent=fmt(a);document.getElementById('vb').textContent=fmt(b);document.getElementById('vc').textContent=fmt(c);
  document.getElementById('eq').textContent='y = '+fmt(a)+'x² '+(b<0?'- ':'+ ')+fmt(Math.abs(b))+'x '+(c<0?'- ':'+ ')+fmt(Math.abs(c));
  document.getElementById('hint').textContent= a===0 ? 'כש-a שווה אפס, זו כבר לא פרבולה אלא קו ישר.' : (a>0 ? 'a חיובי: הפרבולה פתוחה למעלה. הנקודה האדומה היא הקודקוד.' : 'a שלילי: הפרבולה פתוחה למטה. הנקודה האדומה היא הקודקוד.');
}
[A,B,C].forEach(e=>e.addEventListener('input',draw));draw();
</script>
</body>
</html>
